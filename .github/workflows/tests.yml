name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme DesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 16'

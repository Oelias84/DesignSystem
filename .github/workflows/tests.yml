name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: sudo xcode-select -switch $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme DesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 16'
